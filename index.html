<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="Research and rate potential relocation areas on an interactive map." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ReloMap" />
  <title>Relocation Research Map</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Map container — fills full viewport -->
  <div id="map"></div>

  <!-- Layers button — top-left corner -->
  <button id="btn-layers" aria-label="Toggle map layers" aria-expanded="false">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/>
    </svg>
  </button>

  <!-- Layers panel — opens below layers button -->
  <div id="layers-panel" class="hidden" role="dialog" aria-label="Map layers">

    <div class="layers-section-label">Base Map</div>
    <div class="base-layer-btns">
      <button class="base-layer-btn active" data-layer="street">Street</button>
      <button class="base-layer-btn" data-layer="satellite">Satellite</button>
      <button class="base-layer-btn" data-layer="terrain">Terrain</button>
    </div>

    <div class="layers-sep"></div>

    <div class="layers-section-label">Overlays</div>

    <button class="overlay-btn" data-overlay="powerPlants" aria-pressed="false">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      <span>Power Plants</span>
    </button>

    <div id="plant-type-filters" class="hidden">
      <div class="plant-type-grid">
        <button class="plant-type-btn active" data-plant-type="nuclear"><span class="plant-dot" style="background:#F44336"></span>Nuclear</button>
        <button class="plant-type-btn active" data-plant-type="coal"><span class="plant-dot" style="background:#795548"></span>Coal</button>
        <button class="plant-type-btn active" data-plant-type="gas"><span class="plant-dot" style="background:#FF7043"></span>Gas</button>
        <button class="plant-type-btn active" data-plant-type="oil"><span class="plant-dot" style="background:#E64A19"></span>Oil</button>
        <button class="plant-type-btn active" data-plant-type="wind"><span class="plant-dot" style="background:#26C6DA"></span>Wind</button>
        <button class="plant-type-btn active" data-plant-type="solar"><span class="plant-dot" style="background:#FFC107"></span>Solar</button>
        <button class="plant-type-btn active" data-plant-type="hydro"><span class="plant-dot" style="background:#42A5F5"></span>Hydro</button>
        <button class="plant-type-btn active" data-plant-type="biomass"><span class="plant-dot" style="background:#66BB6A"></span>Biomass</button>
        <button class="plant-type-btn active" data-plant-type="geothermal"><span class="plant-dot" style="background:#FF5722"></span>Geo</button>
        <button class="plant-type-btn active" data-plant-type="waste"><span class="plant-dot" style="background:#90A4AE"></span>Waste</button>
        <button class="plant-type-btn active" data-plant-type="other"><span class="plant-dot" style="background:#607D8B"></span>Other</button>
      </div>
    </div>

    <button class="overlay-btn" data-overlay="powerLines" aria-pressed="false">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
      <span>Power Lines</span>
    </button>

    <div id="line-voltage-filters" class="hidden">
      <div class="plant-type-grid">
        <button class="plant-type-btn active" data-line-voltage="v500"><span class="plant-dot" style="background:#F44336"></span>500kV+</button>
        <button class="plant-type-btn active" data-line-voltage="v345"><span class="plant-dot" style="background:#FF5722"></span>345kV</button>
        <button class="plant-type-btn active" data-line-voltage="v230"><span class="plant-dot" style="background:#FF9800"></span>230kV</button>
        <button class="plant-type-btn active" data-line-voltage="v115"><span class="plant-dot" style="background:#FFC107"></span>115kV</button>
        <button class="plant-type-btn active" data-line-voltage="v69"><span class="plant-dot" style="background:#8BC34A"></span>69kV</button>
        <button class="plant-type-btn active" data-line-voltage="vlow"><span class="plant-dot" style="background:#78909C"></span>&lt;69kV</button>
        <button class="plant-type-btn active" data-line-voltage="vunk"><span class="plant-dot" style="background:#546E7A"></span>Unknown</button>
      </div>
    </div>

    <button class="overlay-btn" data-overlay="substations" aria-pressed="false">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
      <span>Substations</span>
    </button>

    <div id="sub-voltage-filters" class="hidden">
      <div class="plant-type-grid">
        <button class="plant-type-btn active" data-sub-voltage="v500"><span class="plant-dot" style="background:#F44336"></span>500kV+</button>
        <button class="plant-type-btn active" data-sub-voltage="v345"><span class="plant-dot" style="background:#FF5722"></span>345kV</button>
        <button class="plant-type-btn active" data-sub-voltage="v230"><span class="plant-dot" style="background:#FF9800"></span>230kV</button>
        <button class="plant-type-btn active" data-sub-voltage="v115"><span class="plant-dot" style="background:#FFC107"></span>115kV</button>
        <button class="plant-type-btn active" data-sub-voltage="v69"><span class="plant-dot" style="background:#8BC34A"></span>69kV</button>
        <button class="plant-type-btn active" data-sub-voltage="vlow"><span class="plant-dot" style="background:#78909C"></span>&lt;69kV</button>
        <button class="plant-type-btn active" data-sub-voltage="vunk"><span class="plant-dot" style="background:#546E7A"></span>Unknown</button>
      </div>
    </div>

    <button class="overlay-btn" data-overlay="dataCenters" aria-pressed="false">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M4 1h16c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V3c0-1.1.9-2 2-2zm0 2v4h16V3H4zm14 2.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm-4 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM4 9h16c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2zm0 2v4h16v-4H4zm14 2.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm-4 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM4 17h16c1.1 0 2 .9 2 2v2c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-2c0-1.1.9-2 2-2zm0 2v2h16v-2H4zm14 1a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm-4 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/></svg>
      <span>Data Centers</span>
    </button>

    <div class="layers-sep"></div>

    <div class="layers-section-label">Places</div>

    <button class="overlay-btn" data-overlay="wholeFoods" aria-pressed="false">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M19 6H17C17 3.24 14.76 1 12 1S7 3.24 7 6H5C3.9 6 3 6.9 3 8V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V8C21 6.9 20.1 6 19 6ZM12 3C13.65 3 15 4.35 15 6H9C9 4.35 10.35 3 12 3ZM19 20H5V8H19V20Z"/></svg>
      <span>Whole Foods</span>
    </button>

    <button class="overlay-btn" data-overlay="groceries" aria-pressed="false">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 6.9 18 9 18h12v-2H9.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63H19c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 23.45 5H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
      <span>Grocery Stores</span>
    </button>

    <button class="overlay-btn" data-overlay="cinemas" aria-pressed="false">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
      <span>Movie Theaters</span>
    </button>

  </div>

  <!-- Search bar — top-center -->
  <div id="search-bar">
    <div id="search-input-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="search-input" type="text" placeholder="Search city, address, or place…" autocomplete="off" spellcheck="false" />
      <button id="search-clear" class="hidden" aria-label="Clear search">&#x2715;</button>
    </div>
    <ul id="search-results" class="hidden" role="listbox" aria-label="Search results"></ul>
  </div>

  <!-- Auth bar — top-right corner -->
  <div id="auth-bar">
    <button id="btn-signin" class="hidden">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>
    <div id="user-info" class="hidden">
      <img id="user-avatar" width="28" height="28" alt="Profile photo" />
      <span id="user-name"></span>
      <button id="btn-signout">Sign out</button>
    </div>
  </div>

  <!-- Toolbar: pill on mobile (bottom center), vertical on desktop (left center) -->
  <div id="toolbar" role="toolbar" aria-label="Map tools">
    <button id="btn-pin" class="tool-btn" aria-label="Pin Drop — click map to drop a rated pin">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      <span>Pin</span>
    </button>

    <button id="btn-paint" class="tool-btn" aria-label="Finger Paint — drag to paint rated areas">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
        <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a1 1 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96a1 1 0 0 0 0-1.41z"/>
      </svg>
      <span>Paint</span>
    </button>

    <button id="btn-polygon" class="tool-btn" aria-label="Polygon — click to draw rated areas">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
        <path d="M17 1L7 6v13l10 4 7-4V5l-7-4zm0 2.18L22 6v10l-5 2.82L7 16.18V7.18L17 3.18zM2 8v12l5 2v-2.5L4 18V9.5L2 8z"/>
      </svg>
      <span>Polygon</span>
    </button>

    <div class="toolbar-sep" aria-hidden="true"></div>

    <button id="btn-notes" class="tool-btn" aria-label="Review saved notes" aria-expanded="false">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
        <path d="M3 18h12v-2H3v2zm0-5h12v-2H3v2zm0-7v2h12V6H3zm13 9.414V17h1.586L21 13.586 19.414 12 16 15.414zM22.414 11l-.829-.828a.8.8 0 0 0-1.17 0l-.657.657L21.17 12.27l.657-.657a.8.8 0 0 0 0-1.171z"/>
      </svg>
      <span>Notes</span>
    </button>
  </div>

  <!-- Location controls — bottom-right corner -->
  <div id="location-controls">
    <button id="btn-locate" class="location-btn hidden" aria-label="Center map on my location">
      <!-- Crosshair / GPS icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
      </svg>
    </button>
    <button id="btn-follow" class="location-btn hidden" aria-label="Toggle follow me mode" aria-pressed="false">
      <!-- Navigation arrow icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
        <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
      </svg>
    </button>
  </div>

  <!-- Drawing HUD — appears beside toolbar when paint or polygon mode is active -->
  <div id="drawing-hud" class="hidden" role="toolbar" aria-label="Drawing controls">

    <!-- Paint controls -->
    <div id="paint-hud-content">
      <button class="hud-rating-btn" data-paint-rating="good" aria-pressed="false" aria-label="Paint color: Good (green)">
        <span class="hud-dot"></span>
      </button>
      <button class="hud-rating-btn" data-paint-rating="neutral" aria-pressed="false" aria-label="Paint color: Neutral (grey)">
        <span class="hud-dot"></span>
      </button>
      <button class="hud-rating-btn" data-paint-rating="bad" aria-pressed="false" aria-label="Paint color: Bad (red)">
        <span class="hud-dot"></span>
      </button>
      <div class="hud-sep" aria-hidden="true"></div>
      <button id="btn-undo-stroke" class="hud-action-btn" aria-label="Undo last stroke">Undo</button>
      <button id="btn-clear-strokes" class="hud-action-btn hud-action-danger" aria-label="Clear all strokes">Clear</button>
      <div class="hud-sep" aria-hidden="true"></div>
      <div class="hud-width-wrap" aria-label="Stroke width">
        <input type="range" id="paint-width" min="3" max="28" step="1" value="10"
               class="hud-width-slider" aria-label="Stroke width">
        <div class="hud-width-preview-box">
          <div id="paint-width-preview" class="hud-width-preview"></div>
        </div>
      </div>
    </div>

    <!-- Polygon controls -->
    <div id="polygon-hud-content" class="hidden">
      <p id="polygon-hint" class="hud-hint">Tap map to place first point</p>
      <button id="btn-polygon-finish" class="hud-action-btn hud-action-primary hidden" aria-label="Finish polygon">Finish</button>
      <button id="btn-polygon-cancel" class="hud-action-btn" aria-label="Cancel polygon">Cancel</button>
    </div>

  </div>

  <!-- Notes panel — mobile bottom sheet / desktop right sidebar -->
  <div id="notes-panel" class="hidden" role="dialog" aria-label="Saved notes" aria-modal="true">
    <div id="notes-panel-header">
      <h2 id="notes-panel-title">Your Notes</h2>
      <button id="btn-notes-close" aria-label="Close notes panel">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
    <div id="notes-filter-bar">
      <div id="notes-filter-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" id="notes-filter-icon">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input id="notes-filter" type="search" placeholder="Filter notes…" autocomplete="off" aria-label="Filter notes">
        <button id="notes-filter-clear" class="hidden" aria-label="Clear filter">✕</button>
      </div>
    </div>
    <div id="notes-list"></div>
  </div>

  <!-- Modal overlay — rating + note form, shown on map click in pin mode -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-card">
      <h2 id="modal-title">Rate This Area</h2>

      <div class="rating-group" role="group" aria-label="Rating">
        <button class="rating-btn" data-rating="good" aria-pressed="false">
          <span class="rating-icon">&#x2714;</span> Good
        </button>
        <button class="rating-btn" data-rating="neutral" aria-pressed="false">
          <span class="rating-icon">&#x2212;</span> Neutral
        </button>
        <button class="rating-btn" data-rating="bad" aria-pressed="false">
          <span class="rating-icon">&#x2718;</span> Bad
        </button>
      </div>

      <label for="note-input" class="note-label">Notes <span class="optional">(optional)</span></label>
      <textarea id="note-input" placeholder="What makes this area good or bad for relocation?" rows="4" maxlength="500"></textarea>

      <div class="modal-actions">
        <button id="btn-cancel" class="btn-secondary">Cancel</button>
        <button id="btn-save" class="btn-primary" disabled>Save Pin</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS — classic script tag, exposes L global -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('SW registered, scope:', reg.scope))
          .catch((err) => console.warn('SW registration failed:', err));
      });
    }
  </script>

  <!-- App — ES module for Firebase v9 imports -->
  <script type="module" src="app.js"></script>

</body>
</html>
